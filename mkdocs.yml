site_name: overfitlab
site_url: https://avmhdt.github.io/backtest-overfitting-lab/
repo_url: https://github.com/avmhdt/backtest-overfitting-lab
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_root_toc_entry: false
            heading_level: 3
            merge_init_into_class: true
extra_css:
  - stylesheets/calculator.css
extra_javascript:
  - path: javascripts/sharpe_calc.js
    type: module
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Memo: memo.md
  - Calculator: calculator.md
  - API reference: api.md
  - Theory:
      - PSR and DSR: theory/psr-dsr.md
      - PBO: theory/pbo.md
      - Cross-validation: theory/cv.md
      - Snooping tests: theory/snooping.md
      - Haircut: theory/haircut.md
      - Reference power: theory/power.md
      - Trial counting: theory/trial-counting.md
  - Trial-log contract: trial-log.md
  - Validation: validation.md
  - Trial logs in practice: projects.md
  - Project criteria: criteria.md
  - Benchmarks: benchmarks.md
  - Decisions: decisions.md
