[project]
name = "overfitlab-study"
version = "0.1.0"
description = "Validation studies, simulations and case studies for overfitlab. Not published."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "overfitlab",
    "polars>=1.10",
    "duckdb>=1.1",
    "arch>=7.0",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "typer>=0.12",
]

[project.scripts]
olab-study = "overfitlab_study.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overfitlab_study"]

[tool.uv.sources]
overfitlab = { workspace = true }
