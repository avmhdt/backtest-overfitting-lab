[project]
name = "overfitlab"
version = "0.1.0"
description = "Statistics that separate a real trading signal from a lucky one: PSR, DSR, PBO, purged CV and data-snooping tests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
keywords = ["backtest", "overfitting", "deflated-sharpe", "cross-validation", "multiple-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
    "pyarrow>=17",
    "typer>=0.12",
]

[project.optional-dependencies]
polars = ["polars>=1.10"]

[project.scripts]
overfitlab = "overfitlab.cli:app"

[project.urls]
Homepage = "https://avmhdt.github.io/backtest-overfitting-lab/"
Repository = "https://github.com/avmhdt/backtest-overfitting-lab"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overfitlab"]

[tool.hatch.build.targets.sdist]
include = ["src/overfitlab", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv.workspace]
members = ["study"]

[tool.uv.sources]
overfitlab-study = { workspace = true }

[dependency-groups]
dev = [
    "overfitlab-study",
    "polars>=1.10",
    "ruff>=0.7",
    "mypy>=1.13",
    "scipy-stubs>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "hypothesis>=6.112",
    "pre-commit>=4.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "study/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PLE", "PLW", "PLC", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["overfitlab.verdict.VerdictConfig"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"study/**" = ["D"]
"scripts/**" = ["D"]
# Typer needs its option metadata in argument defaults.
"**/cli.py" = ["B008"]
# PyArrow is imported on use, so that import overfitlab stays light (NFR-11).
"src/overfitlab/triallog.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/overfitlab", "study/src"]
mypy_path = "src:study/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["numba.*", "arch.*", "sklearn.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "golden: numbers transcribed from the original papers",
    "xcheck: cross-checks against the independent arch package",
    "slow: quick versions of the study simulations",
    "data: needs real raw data files (local only)",
    "bench: performance benchmarks (local only)",
]

[tool.coverage.run]
source_pkgs = ["overfitlab", "overfitlab_study"]
branch = false

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
